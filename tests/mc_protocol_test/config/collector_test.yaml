# ==============================================================================
# NeuroForge Collector - Docker Test Configuration (MC Protocol)
# ==============================================================================
# mc-simulator:5000 → RabbitMQ(host.docker.internal:5672)
# ==============================================================================

collector:
  plc_id: 1
  name: "PLC1_DockerTest"
  tags_file: "config/tags_debug.csv"

  protocol:
    type: "mc_protocol"
    host: "mc-simulator"
    port: 5000
    unit_id: 1
    timeout_ms: 5000
    reconnect_interval_ms: 3000

    extra:
      plc_series: "iq-r"
      frame_type: "binary_3e"
      network_no: 0
      pc_no: 0xFF
      unit_io: 0x03FF
      unit_station: 0
      max_address_gap: 200

  collection_groups:
    - name: "plc_data"
      interval_ms: 1000
      timeout_ms: 5000
      retry_count: 2
      retry_delay_ms: 500

    - name: "alm"
      interval_ms: 1000
      timeout_ms: 5000
      retry_count: 2
      retry_delay_ms: 500
      mode: "on_change"
      deadband: 0

    - name: "log"
      interval_ms: 5000
      timeout_ms: 5000
      retry_count: 2
      retry_delay_ms: 1000

buffer:
  max_size: 10000
  flush_threshold: 1000
  flush_interval_ms: 3000

publisher:
  batch_size: 1100
  retry_count: 3
  retry_delay_ms: 1000

  rabbitmq:
    enabled: true
    host: "host.docker.internal"
    port: 5672
    virtual_host: "/"
    username: "admin"
    password: "admin"
    exchange_name: "plc.data"
    exchange_type: "topic"
    routing_key_prefix: "plc"
    compression: "zlib"
    encryption_enabled: false
    heartbeat: 60
    connection_timeout: 10
    delivery_mode: 2

logging:
  level: "DEBUG"
  collection_level: "DEBUG"
  publish_level: "DEBUG"
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
