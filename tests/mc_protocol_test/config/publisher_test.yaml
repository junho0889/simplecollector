# ============================================================================
# Collector Publisher - Docker Test Configuration
# ============================================================================
# RabbitMQ(host.docker.internal:5672) → DB(host.docker.internal:5433)
# ============================================================================

rabbitmq:
  host: "host.docker.internal"
  port: 5672
  virtual_host: "/"
  username: "admin"
  password: "admin"
  exchange_name: "plc.data"
  exchange_type: "topic"
  queue_db: "queue.db"
  queue_mqtt: "queue.mqtt"
  queue_monitor: "queue.monitor"
  routing_key_pattern: "plc.*.data"
  prefetch_count: 50
  monitor_message_ttl: 30000
  monitor_max_length: 1000
  heartbeat: 60
  connection_timeout: 10
  compression: "zlib"
  encryption_enabled: false
  encryption_key: ""

database:
  enabled: true
  host: "host.docker.internal"
  port: 5433
  database: "postgres"
  user: "user"
  password: "user"
  pool_size: 5
  pool_min_size: 2
  schema_name: "public"
  insert_method: "copy"
  auto_init_schema: true
  master_sync_enabled: true
  master_sync_config_dir: "/app/collector-config"
  collection_groups:
    - name: "plc_data"
      mode: "all"
      retention_period: "90 days"
    - name: "alm"
      mode: "latest"
    - name: "log"
      mode: "all"
      retention_period: "180 days"
      compression_after: "1 minute"
  custom_sql_path: ""
  compression_after: "1 minute"
  compression_segmentby: "plc_id, tag_id"
  compression_orderby: "source_time DESC"
  retention_period: ""

mqtt:
  enabled: false

logging:
  level: "DEBUG"
  file_path: ""
  max_size_mb: 10
  backup_count: 5
