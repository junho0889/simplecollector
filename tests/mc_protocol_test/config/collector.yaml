# ============================================================================
# NeuroForge Collector - MC Protocol Test Configuration
# ============================================================================

collector:
  plc_id: 1
  name: "mc-test-collector"
  enabled: true
  tags_file: "config/tags_1.csv"

  protocol:
    type: "mc_protocol"
    host: "${PLC_HOST:mc-simulator}"
    port: ${PLC_PORT:5000}
    timeout_ms: 5000
    reconnect_interval_ms: 3000
    extra:
      frame_type: "3E"        # 3E or 4E
      network_no: 0
      pc_no: 0xFF
      unit_io: 0x03FF
      unit_no: 0

  collection_groups:
    - name: "fast"
      interval_ms: 10        # 10ms 테스트
      timeout_ms: 50
      retry_count: 3
      retry_delay_ms: 500

publisher:
  database:
    enabled: true
    type: "timescaledb"
    host: "${DB_HOST:timescaledb}"
    port: ${DB_PORT:5432}
    database: "${DB_NAME:collector}"
    user: "${DB_USER:collector}"
    password: "${DB_PASSWORD:collector123}"
    pool_size: 5
    table_name: "plc_data_integrated"

  mqtt:
    enabled: false

  publish_interval_ms: 500
  max_retries: 3
  retry_delay_ms: 1000

buffer:
  max_size: 10000
  batch_size: 100
  threshold_ratio: 0.8
  drop_oldest: true
  persist_on_shutdown: false

logging:
  level: "DEBUG"
  collection_level: "DEBUG"
  publish_level: "DEBUG"
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
