[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-collector"
version = "0.3.3"
description = "Industrial PLC Data Collector"
requires-python = ">=3.10"
license = {text = "MIT"}

# 핵심 의존성만 (MC Protocol 사용 시 추가 패키지 불필요)
dependencies = [
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
# 개별 프로토콜
modbus = ["pymodbus>=3.6.0"]
s7 = ["python-snap7>=1.3"]
# 개별 퍼블리셔
database = ["asyncpg>=0.29.0"]
mqtt = ["aiomqtt>=2.0.0", "paho-mqtt>=2.0.0"]

# 조합 패키지
mc-only = []  # MC Protocol만 (추가 의존성 없음)
mc-db = ["asyncpg>=0.29.0"]  # MC + Database
mc-mqtt = ["aiomqtt>=2.0.0", "paho-mqtt>=2.0.0"]  # MC + MQTT
mc-full = ["asyncpg>=0.29.0", "aiomqtt>=2.0.0", "paho-mqtt>=2.0.0"]

# 전체 설치
full = [
    "pymodbus>=3.6.0",
    "python-snap7>=1.3",
    "asyncpg>=0.29.0",
    "aiomqtt>=2.0.0",
    "paho-mqtt>=2.0.0",
]

# 개발용
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "mypy>=1.5.0",
    "ruff>=0.1.0",
]

[project.scripts]
simple-collector = "src.main:run"

[project.entry-points."simple_collector.protocols"]
mc_protocol = "src.collectors.mc_protocol:McProtocolCollector"
modbus = "src.collectors.modbus:ModbusCollector"
s7_protocol = "src.collectors.s7_protocol:S7Collector"
[project.entry-points."simple_collector.publishers"]
database = "src.publishers.database:DatabasePublisher"
mqtt = "src.publishers.mqtt:MqttPublisher"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
