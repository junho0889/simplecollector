# ============================================================================
# Mosquitto MQTT Broker Configuration
# ============================================================================

# 기본 리스너 (MQTT)
listener 1883

# WebSocket 리스너
listener 9001
protocol websockets

# 인증 설정 (개발용: 익명 허용)
# 프로덕션에서는 password_file 설정 권장
allow_anonymous true

# 로깅
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
log_timestamp_format %Y-%m-%d %H:%M:%S

# 지속성
persistence true
persistence_location /mosquitto/data/

# 메시지 설정
max_queued_messages 10000
message_size_limit 0
