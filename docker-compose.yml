# ============================================================================
#
# Run:
#   docker compose up -d collector
#
# With custom config:
#   CONFIG_FILE=collector_plc_a_test.yaml docker compose up -d collector
#
# Logs:
#   docker compose logs -f collector
#
# Stop:
#   docker compose down
#
# ============================================================================

networks:
  collector_network:
    driver: bridge

services:
  # ===========================================================================
  # MQTT Broker (Mosquitto) - Optional
  # ===========================================================================
  mqtt:
    image: eclipse-mosquitto:2
    container_name: simple-collector-mqtt
    restart: unless-stopped
    profiles:
      - mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./docker/mosquitto/config:/mosquitto/config:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - collector_network
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-i", "healthcheck", "-W", "3"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ===========================================================================
  # Data Collector Service
  # ===========================================================================
  collector:
    build:
      context: .
      dockerfile: Dockerfile
    image: simple-collector:latest
    container_name: simple-collector
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DB_HOST: ${DB_HOST:-timescaledb}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-user}
      DB_PASSWORD: ${DB_PASSWORD:-neuro0901}
      DB_NAME: ${DB_NAME:-neurosense}
      MQTT_HOST: ${MQTT_HOST:-mqtt}
      MQTT_PORT: ${MQTT_PORT:-1883}
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
      - ./data:/app/data
    user: "0:0"
    network_mode: host
    command: ["--config", "/app/config/${CONFIG_FILE:-collector_plc_a_test.yaml}"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ===========================================================================
  # Documentation Server (MkDocs) - Optional
  # ===========================================================================
  docs:
    image: squidfunk/mkdocs-material:latest
    container_name: simple-collector-docs
    restart: unless-stopped
    profiles:
      - docs
    ports:
      - "8089:8000"
    volumes:
      - ./:/docs:ro
    command: serve --dev-addr=0.0.0.0:8000
    networks:
      - collector_network

volumes:
  mosquitto_data:
  mosquitto_log:
