# ==============================================================================
# Simple Collector - 설정 예시 (MC Protocol)
# ==============================================================================
#
# 이 파일은 Collector YAML 설정의 전체 예시입니다.
# 실제 사용 시 복사하여 환경에 맞게 수정하세요.
#
# 관련 파일:
#   - tags CSV:  config/tags_example.csv  (태그 목록)
#   - publisher: config/publisher.yaml    (Publisher Service 설정)
#
# 환경변수 치환:
#   ${VAR_NAME}          → 환경변수 값 (없으면 원본 유지)
#   ${VAR_NAME:default}  → 환경변수 값 (없으면 default 사용)
#
# ==============================================================================

collector:
  # --------------------------------------------------------------------------
  # PLC 기본 정보
  # --------------------------------------------------------------------------
  plc_id: 1                              # PLC 고유 ID (DB plc_master.plc_id)
  name: "PLC1_생산라인A"                   # PLC 이름 (DB plc_master.plc_name)
  tags_file: "config/tags_example.csv"    # 태그 정의 CSV 파일 경로

  # --------------------------------------------------------------------------
  # 프로토콜 설정
  # --------------------------------------------------------------------------
  # type: mc_protocol | modbus | s7_protocol | opcua | fenet
  protocol:
    type: "mc_protocol"
    host: "192.168.0.1"
    port: 5007
    unit_id: 1
    timeout_ms: 5000
    reconnect_interval_ms: 3000

    # 프로토콜별 추가 설정 (type에 따라 다름)
    extra:
      # -- MC Protocol --
      plc_series: "iq-r"          # iq-r | q | l | fx
      frame_type: "binary_3e"     # binary_3e | binary_4e | ascii_3e
      network_no: 0
      pc_no: 0xFF
      unit_io: 0x03FF
      unit_station: 0
      max_address_gap: 200        # 연속 읽기 최대 주소 갭

      # -- Modbus (type: modbus 일 때) --
      # mode: "tcp"               # tcp | rtu | rtu_over_tcp
      # byte_order: "big"         # big | little
      # word_order: "big"         # big | little
      # max_address_gap: 100

  # --------------------------------------------------------------------------
  # 수집 그룹 (collection_groups)
  # --------------------------------------------------------------------------
  # 태그를 그룹으로 나눠 각기 다른 주기/방식으로 수집합니다.
  # CSV의 collection_group 컬럼과 매칭됩니다.
  #
  # mode 옵션:
  #   "polling"    (기본) : 매 주기마다 모든 태그 값을 무조건 발행
  #   "on_change"         : 이전값과 비교하여 변경된 태그만 발행
  #
  # deadband 옵션 (on_change 모드에서만 사용):
  #   0     : 모든 변화 감지 (bool ON/OFF 알람에 적합)
  #   0.5   : 이전값 대비 ±0.5 초과 시 변경으로 감지
  #
  # deadband_type 옵션:
  #   "absolute" (기본) : 절대값 비교 (|new - old| > deadband)
  #   "percent"         : 백분율 비교 (|new - old| / |old| × 100 > deadband)
  #
  collection_groups:

    # ── 실시간 데이터 (2초 주기, 무조건 수집) ──
    # 생산 카운트, 사이클타임 등 실시간 모니터링 데이터
    # CSV에서 collection_group = "fast" 인 태그가 이 그룹에 속함
    - name: "fast"
      interval_ms: 2000
      timeout_ms: 5000
      retry_count: 2
      retry_delay_ms: 500
      # mode 생략 = "polling" (기본값)

    # ── 알람 (1초 스캔, 값 변경 시에만 발행) ──
    # 비상정지, 과부하 등 비트(bool) 알람 태그
    # CSV에서 collection_group = "alm" 인 태그가 이 그룹에 속함
    #
    # 동작 방식:
    #   1. 매 1초마다 M100~M104 비트를 읽음
    #   2. 이전 스캔과 비교하여 값이 변경된 태그만 RabbitMQ로 발행
    #   3. 예: M100이 0→1 (알람 발생) → 발행 / 1→1 (변화 없음) → 무시
    #
    # DB 매칭:
    #   event_master 테이블에 memory+address로 알람 정의 등록
    #   → alarm_history에 알람 발생/해제 이력 자동 기록 (Publisher에서 처리)
    - name: "alm"
      interval_ms: 1000
      timeout_ms: 5000
      retry_count: 2
      retry_delay_ms: 500
      mode: "on_change"           # 핵심: 값 변경 시에만 발행
      deadband: 0                 # 0 = bool ON/OFF 모든 변화 감지

    # ── 로그 (5초 주기, 무조건 수집) ──
    # 온도, 압력, 전류 등 설비 상태 로그
    # CSV에서 collection_group = "log" 인 태그가 이 그룹에 속함
    #
    # 동작 방식:
    #   1. 매 5초마다 D500~D508 값을 읽음
    #   2. 변경 여부와 관계없이 항상 RabbitMQ로 발행
    #   3. 시계열 데이터 추이 분석용
    - name: "log"
      interval_ms: 5000
      timeout_ms: 5000
      retry_count: 2
      retry_delay_ms: 1000
      # mode 생략 = "polling" (기본값, 매 주기 전부 발행)

    # ── (참고) 아날로그 변화 감지 예시 ──
    # 온도가 ±0.5℃ 이상 변할 때만 발행하고 싶다면:
    # - name: "analog_change"
    #   interval_ms: 1000
    #   mode: "on_change"
    #   deadband: 0.5               # ±0.5 초과 시 변경으로 감지
    #   deadband_type: "absolute"   # 절대값 비교

# ==============================================================================
# 버퍼 설정
# ==============================================================================
# Collector → Buffer → Publisher 순서로 데이터가 흐릅니다.
# 버퍼가 flush_threshold에 도달하거나 flush_interval_ms가 경과하면 Publisher로 전달합니다.
buffer:
  max_size: 10000                 # 최대 버퍼 크기 (레코드 수)
  flush_threshold: 1000           # 이 수만큼 쌓이면 Publisher로 flush
  flush_interval_ms: 3000         # 최소 flush 간격 (ms)

# ==============================================================================
# Publisher 설정
# ==============================================================================
# 수집된 데이터를 RabbitMQ로 발행합니다.
publisher:
  batch_size: 1100                # 한 번에 발행할 최대 레코드 수
  retry_count: 3                  # 발행 실패 시 재시도 횟수
  retry_delay_ms: 1000            # 재시도 간격 (ms)

  # RabbitMQ Publisher (→ collector-publisher 서비스로 전달)
  rabbitmq:
    enabled: true
    host: "${RABBITMQ_HOST:rabbitmq}"       # Docker: 컨테이너명, 로컬: localhost
    port: 5672
    virtual_host: "/"
    username: "${RABBITMQ_USER:admin}"
    password: "${RABBITMQ_PASSWORD:admin}"
    exchange_name: "plc.data"               # topic exchange
    exchange_type: "topic"
    routing_key_prefix: "plc"               # → plc.{plc_id}.data
    compression: "zlib"                     # zlib | none
    encryption_enabled: false               # true → Fernet 암호화
    # encryption_key: "your-fernet-key"     # encryption_enabled: true 시 필요
    heartbeat: 60
    connection_timeout: 10
    delivery_mode: 2                        # 2 = persistent (디스크 저장)


# ==============================================================================
# 로깅 설정
# ==============================================================================
logging:
  level: "INFO"                   # 전체 로그 레벨 (DEBUG|VERBOSE|INFO|WARNING|ERROR)
  collection_level: "INFO"        # 수집 관련 로그 레벨
  publish_level: "INFO"           # 발행 관련 로그 레벨
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
