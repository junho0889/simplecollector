# Simple Collector - Modbus Test Configuration
# ============================================================
# Modbus TCP (192.168.0.54:504) → RabbitMQ

collector:
  plc_id: 99
  name: "Modbus_Test"
  tags_file: "config/test/tags.csv"

  protocol:
    type: "modbus"
    host: "192.168.0.54"
    port: 504
    unit_id: 1
    timeout_ms: 3000
    reconnect_interval_ms: 5000

    extra:
      mode: "tcp"
      byte_order: "big"
      word_order: "big"
      max_address_gap: 100

  collection_groups:
    - name: "fast"
      interval_ms: 2000
      timeout_ms: 5000
      retry_count: 2
      retry_delay_ms: 500

buffer:
  max_size: 10000
  flush_threshold: 100
  flush_interval_ms: 3000

publisher:
  batch_size: 100
  retry_count: 3
  retry_delay_ms: 1000

  rabbitmq:
    enabled: true
    host: "192.168.0.54"
    port: 5672
    virtual_host: "/"
    username: "admin"
    password: "admin"
    exchange_name: "plc.data"
    exchange_type: "topic"
    routing_key_prefix: "plc"
    compression: "zlib"
    encryption_enabled: false
    heartbeat: 60
    connection_timeout: 10
    delivery_mode: 2

logging:
  level: "DEBUG"
  collection_level: "DEBUG"
  publish_level: "DEBUG"
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
