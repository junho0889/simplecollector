# Simple Collector - BLE (Bluetooth Low Energy) Configuration
# ============================================================
# POSIOT 진동/환경 센서 → BLE advertisement → RabbitMQ
#
# 사전 요구사항:
#   pip install bleak
#
# Windows: 추가 설정 불필요 (Bleak이 Windows Bluetooth API 직접 사용)
# RPi Docker: privileged + network_mode: host + /var/run/dbus 마운트 필요

collector:
  plc_id: 11
  name: "BLE_POSIOT_01"
  tags_file: "config/test/tags_ble.csv"

  protocol:
    type: "ble"
    host: ""                          # BLE는 미사용
    port: 0                           # BLE는 미사용
    unit_id: 1
    timeout_ms: 10000
    reconnect_interval_ms: 5000

    extra:
      mac_address: "AA:BB:CC:DD:EE:FF"     # 대상 BLE 디바이스 MAC 주소 (실제 값으로 변경)
      device_name_filter: "POSIOT"           # 디바이스 이름 필터 (빈 문자열이면 필터 안 함)
      device_profile: "posiot"               # 디바이스 프로파일 (posiot)
      cache_ttl: 30.0                        # advertisement 캐시 만료 (초)
      duplicate_filter_s: 4.0                # 동일 디바이스 중복 필터 (초)

  collection_groups:
    # BLE 센서는 보통 5초 주기로 advertisement 발송
    - name: "plc_data"
      interval_ms: 5000
      timeout_ms: 10000
      retry_count: 1
      retry_delay_ms: 2000

    # 알람 그룹: 배터리 부족 등 (on_change)
    - name: "alm"
      interval_ms: 5000
      timeout_ms: 10000
      retry_count: 1
      retry_delay_ms: 2000
      mode: "on_change"
      deadband: 0

buffer:
  max_size: 5000
  flush_threshold: 100
  flush_interval_ms: 5000

publisher:
  batch_size: 100
  retry_count: 3
  retry_delay_ms: 1000

  rabbitmq:
    enabled: true
    host: "${RABBITMQ_HOST:localhost}"
    port: ${RABBITMQ_PORT:5672}
    virtual_host: "/"
    username: "${RABBITMQ_USER:admin}"
    password: "${RABBITMQ_PASS:admin}"
    exchange_name: "plc.data"
    exchange_type: "topic"
    routing_key_prefix: "plc"
    compression: "zlib"
    encryption_enabled: false
    heartbeat: 60
    connection_timeout: 10
    delivery_mode: 2

logging:
  level: "DEBUG"
  collection_level: "DEBUG"
  publish_level: "DEBUG"
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
