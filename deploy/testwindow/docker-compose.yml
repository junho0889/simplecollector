# ============================================================================
# testwindow 배포 — docker-compose.yml
# ============================================================================
# 구성:
#   - RabbitMQ (인프라)
#   - Mosquitto (MQTT broker)
#   - simpleCollector ×1 (PLC-D만)
#   - collector-publisher ×1 (MQTT only, DB 저장 안 함)
#
# Windows(amd64) 로컬 테스트용 독립 스택
# ============================================================================

networks:
  collector-net:
    driver: bridge

services:

  # ========================================================================
  # 인프라
  # ========================================================================

  rabbitmq:
    image: rabbitmq:3-management
    container_name: tw-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    networks:
      - collector-net
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: tw-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks:
      - collector-net
    restart: unless-stopped

  # ========================================================================
  # Collector — PLC-D (중간 검사)
  # ========================================================================

  collector-plc-d:
    image: neuroforge_collector_mc:mc-latest
    container_name: tw-collector-plc-d
    volumes:
      - ./collector_plc4.yaml:/app/config/collector.yaml:ro
      - ./tags_10_PLC-D.csv:/app/config/tags_10_PLC-D.csv:ro
    environment:
      CONFIG_PATH: config/collector.yaml
    networks:
      - collector-net
    restart: unless-stopped
    depends_on:
      - rabbitmq

  # ========================================================================
  # Publisher — MQTT only
  # ========================================================================

  publisher:
    image: neuroforge_publisher:latest
    container_name: tw-publisher
    volumes:
      - ./:/app/config:ro
    command: ["--config", "/app/config/publisher.yaml"]
    networks:
      - collector-net
    restart: unless-stopped
    depends_on:
      - rabbitmq
      - mosquitto
