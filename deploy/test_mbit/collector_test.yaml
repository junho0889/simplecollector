# M비트 모니터링 테스트 — PLC-D (192.168.0.54:5007)
# M180, M188만 500ms 간격으로 수집

collector:
  plc_id: 99
  name: "TEST-MBIT"
  description: "M비트 모니터링 테스트"
  tags_file: "config/tags_mbit_test.csv"

  protocol:
    type: "mc_protocol"
    host: "192.168.0.54"
    port: 5007
    unit_id: 1
    timeout_ms: 5000
    reconnect_interval_ms: 3000

    extra:
      plc_series: "iq-r"
      frame_type: "binary_3e"
      network_no: 0
      pc_no: 0xFF
      unit_io: 0x03FF
      unit_station: 0
      max_address_gap: 500

  collection_groups:
    - name: "log"
      interval_ms: 500
      timeout_ms: 5000
      retry_count: 2
      retry_delay_ms: 500
      mode: "on_change"
      deadband: 0

buffer:
  max_size: 1000
  flush_threshold: 100
  flush_interval_ms: 1000

publisher:
  batch_size: 100
  retry_count: 3
  retry_delay_ms: 1000

  rabbitmq:
    enabled: true
    host: "${RABBITMQ_HOST:rabbitmq}"
    port: 5672
    virtual_host: "/"
    username: "${RABBITMQ_USER:admin}"
    password: "${RABBITMQ_PASSWORD:admin}"
    exchange_name: "plc.data"
    exchange_type: "topic"
    routing_key_prefix: "plc"
    compression: "zlib"
    encryption_enabled: false
    heartbeat: 60
    connection_timeout: 10
    delivery_mode: 2

logging:
  level: "VERBOSE"
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
