# ============================================================================
# Publisher Test — MC + BLE → 192.168.0.12 TimescaleDB (test_jem 스키마)
# ============================================================================

rabbitmq:
  host: "${RABBITMQ_HOST:127.0.0.1}"
  port: 5672
  virtual_host: "/"
  username: "admin"
  password: "admin"
  exchange_name: "plc.data"
  exchange_type: "topic"
  queue_db: "queue.test.db"
  queue_mqtt: "queue.test.mqtt"
  queue_monitor: "queue.test.monitor"
  routing_key_pattern: "plc.*.data"
  prefetch_count: 50
  monitor_prefetch: 10
  monitor_message_ttl: 30000
  monitor_max_length: 10000
  heartbeat: 60
  connection_timeout: 10
  compression: "zlib"
  encryption_enabled: false
  encryption_key: ""

database:
  enabled: true
  host: "host.docker.internal"
  port: 25432
  database: "neurosense"
  user: "user"
  password: "neuro0901"
  pool_size: 5
  pool_min_size: 2
  schema_name: "test_jem"
  device_types: ["plc", "ble"]
  insert_method: "copy"
  auto_init_schema: true
  master_sync_enabled: true
  collection_groups:
    - name: "plc_data"
      mode: "all"
      device_type: "plc"
    - name: "alm"
      mode: "latest"
      device_type: "plc"
      extensions:
        history:
          trigger_on: "v_bool"
    - name: "log"
      mode: "latest"
      device_type: "plc"
    - name: "action"
      mode: "latest"
      device_type: "plc"
    - name: "ble_data"
      mode: "all"
      device_type: "ble"
  compression_after: "7 days"
  compression_segmentby: "plc_id, tag_id"
  compression_orderby: "timestamp DESC"

mqtt:
  enabled: false

logging:
  level: "DEBUG"
  file_path: ""
  max_size_mb: 10
  backup_count: 5
