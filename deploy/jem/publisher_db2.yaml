# ============================================================================
# Publisher DB2 — 원격 TimescaleDB (10.8.0.2:5432)
# ============================================================================
# 10개 PLC 데이터를 별도 큐(*.copy)로 복사하여 원격 DB에 저장
# 큐: queue.db.copy (COPY), queue.monitor.copy (UPSERT)
# RabbitMQ에서 동일 exchange에 바인딩된 별도 큐로 메시지 복사 수신

rabbitmq:
  host: "${RABBITMQ_HOST:rabbitmq}"
  port: 5672
  virtual_host: "/"
  username: "${RABBITMQ_USER:admin}"
  password: "${RABBITMQ_PASSWORD:admin}"
  exchange_name: "plc.data"
  exchange_type: "topic"
  queue_db: "queue.db.copy"
  queue_mqtt: "queue.mqtt.copy"
  queue_monitor: "queue.monitor.copy"
  routing_key_pattern: "plc.*.data"
  prefetch_count: 50
  monitor_prefetch: 30
  monitor_message_ttl: 30000
  monitor_max_length: 10000
  heartbeat: 60
  connection_timeout: 10
  compression: "zlib"
  encryption_enabled: false
  encryption_key: ""

database:
  enabled: true
  host: "10.8.0.2"
  port: 5432
  database: "neurosense"
  user: "user"
  password: "neuro0901"
  pool_size: 5
  pool_min_size: 2
  schema_name: "jem_jh02"
  insert_method: "copy"
  auto_init_schema: true
  master_sync_enabled: true
  collection_groups:
    - name: "plc_data"
      mode: "all"
      retention_period: "3 years"
      compression_after: "1 day"
    - name: "alm"
      mode: "latest"
      retention_period: "3 years"
      compression_after: "1 day"
      extensions:
        history:
          trigger_on: "v_bool"
    - name: "log"
      mode: "latest"
      retention_period: "3 years"
      compression_after: "1 day"
      extensions:
        snapshot:
          triggers:
            # ===== PLC-A/B/C/EFG/H/I/K/L (plc_id=1,2,3,5,6,7,9,10) =====
            # M188 → Log3: D360-D368 (5 tags)
            - watch_tag: 3000
              plc_ids: [1, 2, 3, 5, 6, 7, 9, 10]
              capture_tags: [3001, 3002, 3003, 3004, 3005]
            # ===== PLC-D (plc_id=4) =====
            # M180 → Log1: R9100-R9458 (48 tags)
            - watch_tag: 3005
              plc_ids: [4]
              capture_tags: [
                3008, 3009, 3010, 3011, 3012, 3013, 3014, 3015, 3016, 3017,
                3018, 3019, 3020, 3021, 3022, 3023, 3024, 3025, 3026, 3027,
                3028, 3029, 3030, 3031, 3032, 3033, 3034, 3035, 3036, 3037,
                3038, 3039, 3040, 3041, 3042, 3043, 3044, 3045, 3046, 3047,
                3048, 3049, 3050, 3051, 3052, 3053, 3054, 3055
              ]
            # M188 → Log3: D360-D368 (5 tags)
            - watch_tag: 3006
              plc_ids: [4]
              capture_tags: [3000, 3001, 3002, 3003, 3004]
            # M197 → Log7: D2758-D3008 (20 tags)
            - watch_tag: 3007
              plc_ids: [4]
              capture_tags: [
                3056, 3057, 3058, 3059, 3060, 3061, 3062, 3063, 3064, 3065,
                3066, 3067, 3068, 3069, 3070, 3071, 3072, 3073, 3074, 3075
              ]
            # ===== PLC-J (plc_id=8) =====
            # M180 → Log1: R9500-R9842 (36 tags)
            - watch_tag: 3000
              plc_ids: [8]
              capture_tags: [
                3001, 3002, 3003, 3004, 3005, 3006, 3007, 3008, 3009, 3010,
                3011, 3012, 3013, 3014, 3015, 3016, 3017, 3018, 3019, 3020,
                3021, 3022, 3023, 3024, 3025, 3026, 3027, 3028, 3029, 3030,
                3031, 3032, 3033, 3034, 3035, 3036
              ]
            # M188 → Log3: D360-D368 (5 tags)
            - watch_tag: 3037
              plc_ids: [8]
              capture_tags: [3038, 3039, 3040, 3041, 3042]
    - name: "action"
      mode: "latest"
      retention_period: "3 years"
      compression_after: "1 day"
  custom_sql_path: "custom_init.sql"
  compression_after: "1 day"
  compression_segmentby: "plc_id, tag_id"
  compression_orderby: "timestamp DESC"
  retention_period: "3 years"

mqtt:
  enabled: false

logging:
  level: "INFO"
  file_path: "logs/publisher-db2.log"
  max_size_mb: 10
  backup_count: 5
