# BLE 멀티디바이스 수집기 설정
# 1 컨테이너에서 tags CSV의 모든 BLE 센서를 수집
# mac_address 컬럼이 있는 태그는 자동으로 멀티디바이스 모드로 동작
collector:
  ble_id: 1
  name: "BLE_SITE_A"
  description: "BLE 센서 수집기"
  site: ""
  area: ""
  line: ""
  tags_file: "deploy/ble/tags_ble_multi.csv"

  protocol:
    type: "ble"
    extra:
      # advertisement 캐시 만료 시간 (초) — 이 시간 내에 새 패킷이 없으면 데이터 없음 처리
      cache_ttl: 30.0
      # 같은 MAC의 중복 advertisement 무시 시간 (초) — 너무 짧으면 CPU 낭비, 너무 길면 갱신 느림
      duplicate_filter_s: 4.0

  collection_groups:
    - name: "ble_data"
      interval_ms: 1000

publisher:
  rabbitmq:
    enabled: true
    host: "${RMQ_HOST:rabbitmq}"
    port: ${RMQ_PORT:5672}
    virtual_host: "/"
    username: "${RMQ_USER:admin}"
    password: "${RMQ_PASS:admin}"
    exchange_name: "plc.data"
    routing_key_prefix: "plc"
    compression: "zlib"
    encryption_enabled: false
  publish_interval_ms: 1000

buffer:
  max_size: 5000
  batch_size: 200
  threshold_ratio: 0.8

logging:
  level: "DEBUG"
  collection_level: "DEBUG"
  publish_level: "DEBUG"
