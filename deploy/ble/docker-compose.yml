# ============================================================================
# BLE 멀티디바이스 — docker-compose.yml (Raspberry Pi)
# ============================================================================
# 구성:
#   - RabbitMQ (포트 5682/15682) — 기존 서비스와 충돌 방지
#   - Mosquitto (포트 1893)
#   - Node-RED (포트 1882)
#   - Publisher (RabbitMQ → MQTT)
#   - BLE Collector ×1 (N개 센서를 하나의 컨테이너에서 수집)
#
# 사용법:
#   docker compose up -d
#   Node-RED: http://<PI_IP>:1882
#   RabbitMQ: http://<PI_IP>:15682 (admin/admin)
# ============================================================================

services:

  # --------------------------------------------------------------------------
  # 인프라
  # --------------------------------------------------------------------------

  rabbitmq:
    image: rabbitmq:3-management
    container_name: ble-rabbitmq
    ports:
      - "5682:5672"
      - "15682:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: ble-mosquitto
    ports:
      - "1893:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

  nodered:
    image: nodered/node-red:latest
    container_name: ble-nodered
    ports:
      - "1882:1880"
    volumes:
      - nodered_data:/data
    environment:
      TZ: Asia/Seoul
    depends_on:
      - mosquitto
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Publisher — RabbitMQ → MQTT forward
  # --------------------------------------------------------------------------

  publisher:
    image: neuro_publisher:latest
    container_name: ble-publisher
    ports:
      - "4840:4840"
    volumes:
      - ./publisher_ble.yaml:/app/config/publisher.yaml:ro
      - ./collector_ble_multi.yaml:/app/config/collector_ble_multi.yaml:ro
      - ./tags_ble_multi.csv:/app/config/tags_ble_multi.csv:ro
      - opcua_certs:/app/certs
    command: ["--config", "/app/config/publisher.yaml"]
    environment:
      RABBITMQ_HOST: rabbitmq
      MQTT_HOST: mosquitto
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # BLE Collector — 멀티디바이스 (1 컨테이너에서 N개 센서 수집)
  # --------------------------------------------------------------------------

  collector-ble:
    image: neuro_collector_ble:latest
    container_name: ble-collector
    network_mode: host
    privileged: true
    volumes:
      - /var/run/dbus:/var/run/dbus:ro
      - ./collector_ble_multi.yaml:/app/config/collector.yaml:ro
      - ./tags_ble_multi.csv:/app/deploy/ble/tags_ble_multi.csv:ro
    environment:
      RMQ_HOST: 127.0.0.1
      RMQ_PORT: 5682
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

volumes:
  nodered_data:
  opcua_certs:
