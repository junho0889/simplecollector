  # ========================================================================
  # Publisher — RabbitMQ → TimescaleDB (PLC + BLE 통합)
  # ========================================================================

  publisher:
    build:
      context: ../../../collector-publisher
      dockerfile: Dockerfile
    image: fulltest-publisher:latest
    container_name: fulltest-publisher
    volumes:
      - ./config/:/app/config/:ro
    command: ["--config", "/app/config/publisher_test.yaml"]
    depends_on:
      rabbitmq:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    networks:
