# ============================================================================
# RPi (192.168.0.14) — 10 MC Collectors + 1 BLE Collector
# ============================================================================
# MC Simulator: 192.168.0.12:5001-5010
# RabbitMQ:     192.168.0.12:46672
# ============================================================================

services:

  collector-plc-a:
    image: neuroforge_collector_mc:test-arm64
    container_name: rpi-collector-plc-a
    volumes:
      - ./config/collector_plc1.yaml:/app/config/collector.yaml:ro
      - ./config/tags_04_PLC-A.csv:/app/config/tags_04_PLC-A.csv:ro
    environment:
      CONFIG_PATH: config/collector.yaml
    restart: unless-stopped

  collector-plc-b:
    image: neuroforge_collector_mc:test-arm64
    container_name: rpi-collector-plc-b
    volumes:
      - ./config/collector_plc2.yaml:/app/config/collector.yaml:ro
      - ./config/tags_02_PLC-B.csv:/app/config/tags_02_PLC-B.csv:ro
