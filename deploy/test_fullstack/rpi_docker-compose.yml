  collector-ble:
    image: neuroforge_collector_ble:test-latest
    container_name: rpi-collector-ble
    network_mode: host
    privileged: true
    volumes:
      - /var/run/dbus:/var/run/dbus:ro
      - ./collector_ble.yaml:/app/config/collector.yaml:ro
      - ./tags_ble.csv:/app/config/tags_ble.csv:ro
    restart: unless-stopped
