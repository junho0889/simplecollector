# ============================================================================
# Publisher Test — 로컬 통합 테스트용 (10 PLC + BLE → TimescaleDB)
# ============================================================================

rabbitmq:
  host: "rabbitmq"
  port: 5672
  virtual_host: "/"
  username: "admin"
  password: "admin"
  exchange_name: "plc.data"
  exchange_type: "topic"
  queue_db: "queue.db"
  queue_mqtt: "queue.mqtt"
  queue_monitor: "queue.monitor"
  routing_key_pattern: "plc.*.data"
  prefetch_count: 50
  monitor_prefetch: 10
  monitor_message_ttl: 30000
  monitor_max_length: 10000
  heartbeat: 60
  connection_timeout: 10
  compression: "zlib"
  encryption_enabled: false
  encryption_key: ""

database:
  enabled: true
  host: "timescaledb"
  port: 5432
  database: "neurosense"
  user: "user"
  password: "neuro0901"
  pool_size: 5
  pool_min_size: 2
  schema_name: "jem_test"
  device_types: ["plc", "ble"]
  insert_method: "copy"
  auto_init_schema: true
  master_sync_enabled: true
  collection_groups:
    - name: "plc_data"
      mode: "all"
      device_type: "plc"
      retention_period: ""
      compression_after: "1 day"
    - name: "alm"
      mode: "latest"
      device_type: "plc"
      retention_period: ""
      compression_after: "1 day"
      extensions:
        history:
          trigger_on: "v_bool"
    - name: "log"
      mode: "latest"
      device_type: "plc"
      retention_period: ""
      compression_after: "1 day"
    - name: "action"
      mode: "latest"
      device_type: "plc"
      retention_period: ""
      compression_after: "1 day"
    - name: "ble_data"
      mode: "all"
      device_type: "ble"
      retention_period: ""
      compression_after: "7 days"
  custom_sql_path: "custom_init.sql"
  compression_after: "1 day"
  compression_segmentby: "plc_id, tag_id"
  compression_orderby: "timestamp DESC"
  retention_period: ""

scheduler:
  enabled: false
  jobs: []

mqtt:
  enabled: false

logging:
  level: "INFO"
  file_path: "logs/publisher-test.log"
  max_size_mb: 10
  backup_count: 5
