# ============================================================================
# testpublisher — 통합 테스트 (DB + RabbitMQ)
# ============================================================================

rabbitmq:
  host: "${RABBITMQ_HOST:rabbitmq}"
  port: 5672
  virtual_host: "/"
  username: "${RABBITMQ_USER:admin}"
  password: "${RABBITMQ_PASSWORD:admin}"
  exchange_name: "plc.data"
  exchange_type: "topic"
  queue_db: "queue.db"
  queue_mqtt: "queue.mqtt"
  queue_monitor: "queue.monitor"
  routing_key_pattern: "plc.*.data"
  prefetch_count: 50
  monitor_prefetch: 10
  monitor_message_ttl: 30000
  monitor_max_length: 10000
  heartbeat: 60
  connection_timeout: 10
  compression: "zlib"
  encryption_enabled: false
  encryption_key: ""

database:
  enabled: true
  host: "${DB_HOST:timescaledb}"
  port: 5432
  database: "testdb"
  user: "postgres"
  password: "postgres"
  pool_size: 3
  pool_min_size: 1
  schema_name: "public"
  auto_init_schema: true
  master_sync_enabled: true
  master_sync_config_dir: "/app/config"
  collection_groups:
    - name: "plc_data"
      mode: "all"

mqtt:
  enabled: false

logging:
  level: "INFO"
